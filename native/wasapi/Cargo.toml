[package]
name = "folia-wasapi"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "WASAPI exclusive-mode renderer for Folia (napi-rs native addon)"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
